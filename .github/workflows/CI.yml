name: Build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # HearthTube's own unit tests. ScreensaverManagerTest and SuggestionsControllerTest are SmartTube's and fail
      # under Robolectric, so they're not listed. (Run separately from the build: a "Ststable" task name next to a
      # hearthtube task pulls in a plugin the hearthtube variant doesn't use.)
      - name: Unit tests
        run: >
          ./gradlew :common:testStstableDebugUnitTest
          --tests '*.utils.*Test'
          --tests '*.prefs.*Test'
          --tests '*.app.presenters.*Test'
          --tests '*.misc.BackupArchiveImporterTest'

      - name: Lint (shared module)
        run: ./gradlew :common:lintStstableRelease

      - name: Build HearthTube (debug)
        run: ./gradlew :smarttubetv:assembleHearthtubeDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HearthTube_debug_universal
          path: ./smarttubetv/build/outputs/apk/hearthtube/debug/*_universal.apk
          if-no-files-found: warn
