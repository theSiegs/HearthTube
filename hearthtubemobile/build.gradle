apply from: gradle.ext.sharedModulesConstants

apply plugin: 'com.android.application'
apply from: "$rootDir/gradle/hearthtube_version.gradle"

// Release signing: the same key as Hearth and the TV app (one signing certificate, so Hearth's provider trusts this app
// by package and certificate, and one key lineage to look after). keystore.properties (git-ignored, in the repository
// root) holds storeFile, storePassword, keyAlias and keyPassword, or a single signingPropertiesFile=<path> line pointing
// at the file that holds them, as for the TV app. Without it a release build is simply unsigned.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

    def pointer = keystoreProperties['signingPropertiesFile']
    if (pointer) {
        def signingFile = new File(pointer)
        if (!signingFile.isFile()) {
            throw new GradleException("keystore.properties: signingPropertiesFile not found")
        }
        keystoreProperties = new Properties()
        signingFile.withReader('UTF-8') { keystoreProperties.load(it) }
        // A Windows path with single backslashes loses them to .properties escaping (C:\keys\a.jks reads as
        // C:keysa.jks): take the line as written when only that names an existing file
        def storeFile = keystoreProperties['storeFile']
        def rawLine = signingFile.readLines('UTF-8').find { it.trim().startsWith('storeFile=') }
        def raw = rawLine != null ? rawLine.trim().substring('storeFile='.length()).trim() : null
        if (storeFile != null && !new File(storeFile).isFile() && raw != null && new File(raw).isFile()) {
            keystoreProperties['storeFile'] = raw
        }
    }
}

// HearthTube Mobile: the phone and tablet app. It reuses everything under :common (presenters, kids filters, parent PIN,
// allowance) and MediaServiceCore, and brings its own touch screens. Unlike the TV app it is built for kids' devices
// first, so it ships no boot receiver, no overlay permission and no TV channels (see AndroidManifest.xml).
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    compileSdkVersion project.properties.compileSdkVersion
    buildToolsVersion project.properties.buildToolsVersion
    testOptions.unitTests.includeAndroidResources = true
    ndkVersion "21.0.6113669" // as the TV app: strips debug symbols from the native libraries (much smaller APKs)

    defaultConfig {
        applicationId "com.thesiegs.hearthtube.mobile"
        // The kids check (ParentGate.isKidsProfile) answers "no" below API 24, and Family Link's tools need it anyway
        minSdkVersion 24
        targetSdkVersion project.properties.compileSdkVersion
        // The same version as the TV app (a release date; its versionCode rises with every release), built on the same
        // SmartTube, shown in About (common's smarttube_base_version). Only a higher versionCode is an update.
        def hearthTubeVersion = readHearthTubeVersion(rootProject.file('smarttubetv/src/hearthtube/release_version.txt'))
        versionCode hearthTubeVersion.code
        versionName hearthTubeVersion.name
        resValue 'string', 'smarttube_base_version', readSmartTubeVersion()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Take the libraries' ststable flavor, as the TV app's hearthtube flavor does
        missingDimensionStrategy 'default', 'ststable'

    }

    // One APK per ABI (a phone or tablet takes the one for its processor) and a universal one for the rest: the all-in-one
    // is about 120 MB
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86'
            universalApk true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    // Tells common this is the phone and tablet build (no suspended-apps guess, no playback signed out)
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lintOptions {
        abortOnError true
        // This is not a TV app: its TV checks don't apply
        disable 'MissingLeanbackLauncher', 'UnsupportedTvHardware'
        // The library's own R.bool, read by :common, looks unused from here
        disable 'UnusedResources'
        // Glide's code mentions posting a notification; nothing here posts one
        disable 'NotificationPermission'
    }
}

// AiSList's AI-channel lists ship in the app (assets/aislist, read by AiSlopList), so a kid's phone is covered from the
// first start, even offline; the app fetches newer ones once a day. The copy is the one the TV app keeps in its sources.
def aislistAssets = file("$buildDir/generated/aislist/assets")
def copyAiSlopLists = tasks.register('copyAiSlopLists', Copy) {
    from(rootProject.file('smarttubetv/src/hearthtube/aislist'))
    into(new File(aislistAssets, 'aislist'))
}
android.sourceSets.main.assets.srcDir(aislistAssets)
android.applicationVariants.all { variant ->
    variant.mergeAssetsProvider.configure { dependsOn copyAiSlopLists }
}

dependencies {
    implementation 'androidx.annotation:annotation:' + annotationXVersion
    implementation 'androidx.recyclerview:recyclerview:' + recyclerviewXVersion
    implementation 'androidx.media:media:' + mediaXVersion // exoplayer fix

    implementation 'com.github.bumptech.glide:glide:' + glideVersion

    implementation project(':fragment-1.1.0')
    implementation project(':common')
    implementation project(':sharedutils')
    implementation project(':mediaserviceinterfaces')
    implementation project(':youtubeapi')

    implementation project(':exoplayer-library-core')
    implementation project(':exoplayer-library-ui')
    implementation project(':exoplayer-extension-mediasession')

    implementation 'io.reactivex.rxjava2:rxandroid:' + rxAndroidVersion
    implementation 'io.reactivex.rxjava2:rxjava:' + rxJavaVersion

    testImplementation 'junit:junit:' + junitVersion
    testImplementation 'org.robolectric:robolectric:' + robolectricVersion
}
